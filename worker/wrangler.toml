# WhiteBox multiplayer Worker — ISOLATED config.
#
# This is a self-contained Worker for local development and (optionally) later
# deployment. It does NOT modify or replace any existing WhiteBox production
# deployment, DNS, or bindings.
#
# Local dev:   npm run worker:dev      (wrangler dev -> http://127.0.0.1:8787)
# The browser client defaults to ws://127.0.0.1:8787 (see VITE_MP_URL).

name = "whitebox-mp"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One Durable Object class backs all rooms; each room code maps to one instance.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# SQLite-backed Durable Objects (current recommended storage for new classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Sign-in sessions. Stores an opaque session id -> verified Google profile.
# Create with:  npx wrangler kv namespace create SESSIONS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "13d23a07e6ec4e66b372dab75e44d053"

# Player-created games (title, description, tags, artwork type). A real SQL
# database rather than KV because the library filters and sorts by created_at
# and creator. Schema lives in worker/migrations/.
[[d1_databases]]
binding = "GAMES"
database_name = "whitebox-games"
database_id = "794832a6-f3bb-45eb-b7d2-38c0cce4de81"

# Player-uploaded thumbnails. R2 rather than D1: images are binary blobs with no
# queryable fields, and keeping them out of the database means listing the
# library never pulls image data through SQLite.
#
# TEMPORARILY DISABLED: a Worker cannot deploy while it declares a bucket that
# does not exist, and R2 is still switched off on this account. Until it is
# enabled, photo uploads return 503 storage_not_configured and the UI shows
# "Image uploads are not available right now" — every other feature is
# unaffected, and thumbs.js already handles a missing binding.
#
# To restore, enable R2 in the Cloudflare dashboard, then uncomment:
#
#   [[r2_buckets]]
#   binding = "THUMBS"
#   bucket_name = "whitebox-thumbs"

# Google OAuth. Set with:  npx wrangler secret put GOOGLE_CLIENT_ID
# (secrets are encrypted; do NOT commit a client id as a plain var)

# Supabase Auth. The Worker validates session tokens against Supabase's own
# /auth/v1/user endpoint, so the project JWT secret never lives here.
# Set with:  npx wrangler secret put SUPABASE_URL
#            npx wrangler secret put SUPABASE_ANON_KEY

# Origins allowed to call the auth endpoints with credentials.
# Comma-separated. Localhost dev origins are always allowed.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://rarelyknown.in"

[observability]
enabled = true
