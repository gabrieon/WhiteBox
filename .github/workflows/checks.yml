name: WhiteBox checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run WORDLOCK tests
        run: npm run test:wordlock

      # Quizzes are player-authored data rendered in every visitor's browser,
      # so their validation and the option-shuffle answer remap are worth
      # checking on every push rather than only when someone remembers.
      - name: Run create/quiz tests
        run: npm run test:create

      # The artwork quota is the only thing between a player and the site's
      # shared Gemini allowance, so its boundaries are worth checking every push.
      - name: Run artwork quota tests
        run: npm run test:artwork

      # Rule icons are declared per game and nothing validates them at runtime —
      # a typo falls back silently. Cheap to check on every push.
      - name: Run rules icon tests
        run: npm run test:rules

      - name: Build the site bundle
        run: npm run build
