<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WhiteBox is a browser-based home for quick games, curious challenges, and friendly competition."
    />
    <meta name="theme-color" content="#0b0b0b" />
    <meta property="og:title" content="WhiteBox — Discover Your Next Favorite Game" />
    <meta
      property="og:description"
      content="Browser games with rooms: competitive tests, map games, drawing battles and quick party challenges."
    />
    <meta property="og:type" content="website" />
    <title>WhiteBox — Discover Your Next Favorite Game</title>
    <script>
      // Force HTTPS before anything else runs. The Worker also issues a 301,
      // but a cached edge response can be served without the Worker running,
      // and Google's OAuth compares the exact JavaScript origin — so a page
      // left on http://rarelyknown.in fails sign-in with `origin_mismatch`.
      (function () {
        if (location.protocol !== 'http:') return;
        location.replace(
          'https://' + location.host + location.pathname + location.search + location.hash
        );
      })();
    </script>
    <script>
      // Apply the stored theme before the first paint. This must stay inline
      // and ahead of the app bundle: any later and the page would paint once in
      // the default theme and then flip, which reads as a flash.
      (function () {
        try {
          var t = window.localStorage.getItem('whitebox:theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#0b0b0b' : '#ffffff');
        } catch (e) {
          // Storage blocked — the html attribute above already holds the default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
